[package]
name = "chipsoc-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
chipsoc-admin.workspace = true
