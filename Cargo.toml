[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UoM-ChipSoc/chipsoc-bot"

[workspace.dependencies]
chipsoc-admin = { version = "0.1.0", path = "crates/admin" }
chipsoc-bot = { version = "0.1.0", path = "crates/cli" }
chipsoc-client = { version = "0.1.0", path = "crates/client" }
chipsoc-config = { version = "0.1.0", path = "crates/config" }
chipsoc-diff = { version = "0.1.0", path = "crates/diff" }
chipsoc-discord = { version = "0.1.0", path = "crates/discord" }
chipsoc-engine = { version = "0.1.0", path = "crates/engine" }
chipsoc-fedproto = { version = "0.1.0", path = "crates/fedproto" }
chipsoc-model = { version = "0.1.0", path = "crates/model" }
chipsoc-runtime = { version = "0.1.0", path = "crates/runtime" }
chipsoc-store = { version = "0.1.0", path = "crates/store" }
chipsoc-tui = { version = "0.1.0", path = "crates/tui" }
chipsoc-voice = { version = "0.1.0", path = "crates/voice" }
chipsoc-web = { version = "0.1.0", path = "crates/web" }
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
feed-rs = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.8"
tracing = "0.1.44"
twilight-model = "0.18.0"

[workspace.lints.clippy]
all = "warn"
